<title>Assistant Automa hybride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: mobile-first, one column; from 1024px the automa status and Mars sit in a sticky sidebar next to the current step. */
:root{
  --bg:#FFFFFF; --panel:#F3F8F8; --panel2:#E3F2F3; --ink:#12202B; --muted:#4F5B62; --line:#CFE0E2;
  --cyan:#2FB6C0; --cyan-ink:#1B5A7E; --sand:#EDE0CD; --sand-ink:#8F3A10; --danger:#B5342A;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --text:'Source Serif 4',Georgia,serif;
  --p1:#3D7A47; --p2:#2E5A8A; --p3:#24719E; --p4:#B84D18; --p5:#E2BE2C;
  --p2g:linear-gradient(100deg,#2E5A8A 0%,#2E5A8A 30%,#B5342A 100%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1820; --panel:#15232D; --panel2:#18303A; --ink:#E4EEF0; --muted:#9DB2BA; --line:#2A4552;
  --cyan:#3CC4CE; --cyan-ink:#8FE3E8; --sand:#2C2620; --sand-ink:#F0A77E; --danger:#F07468; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1820; --panel:#15232D; --panel2:#18303A; --ink:#E4EEF0; --muted:#9DB2BA; --line:#2A4552;
  --cyan:#3CC4CE; --cyan-ink:#8FE3E8; --sand:#2C2620; --sand-ink:#F0A77E; --danger:#F07468; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:0 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
p{margin:0;text-wrap:pretty}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.lab{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.pi{display:inline-block;vertical-align:-3px;flex-shrink:0}

.layout{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "side" "log"}
.layout > .main{grid-area:main;display:flex;flex-direction:column;gap:14px;min-width:0}
.layout > .side{grid-area:side;display:flex;flex-direction:column;gap:14px;min-width:0}
.layout > .logz{grid-area:log;min-width:0}
.solo{max-width:760px;width:100%;margin-inline:auto}
@media (min-width:1024px){
  .layout{grid-template-columns:minmax(0,1fr) 380px;grid-template-areas:"main side" "log side";align-items:start}
  .layout > .side{position:sticky;top:84px;max-height:calc(100vh - 96px);overflow:auto;overscroll-behavior:contain}
  .side .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .side .stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .side .full{display:none}
  .side .short{display:inline}
}
@media (min-width:600px) and (max-width:1023px){.layout{max-width:820px;width:100%;margin-inline:auto}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:3px solid var(--cyan);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand b{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan-ink)}
.tb{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;min-height:40px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.tb:disabled{opacity:.4;cursor:default}
.tb.warn{border-color:var(--danger);color:var(--danger)}
.tb .short{display:none}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;display:flex;align-items:center;gap:6px}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600}
.stat .sub{font-size:12px;line-height:1.25;color:var(--muted)}
.stat .k{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.adj{display:flex;gap:4px}
.adj button{width:34px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-weight:800;font-size:17px;line-height:1}
.params{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.param{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.param .v{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan)}
.param.max .v{color:var(--cyan-ink)}

/* phase banner and buttons */
.ban{color:#fff;display:grid;grid-template-columns:64px minmax(0,1fr);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,10px 100%,0 calc(100% - 10px));box-shadow:inset 0 -4px 0 rgba(0,0,0,.22)}
.ban .r{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.26);font-family:var(--display);font-style:italic;font-weight:800;font-size:34px;padding-bottom:4px}
.ban > div{padding:8px 16px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ban .nm{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;text-transform:uppercase;line-height:1}
.ban .tg{font-size:14px}
.ban.dark{color:#1F1A24}
.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.phb{border:none;color:#fff;padding:10px 6px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:0;min-height:64px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);opacity:.8;text-align:left}
.short{display:none}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.phb .r{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;line-height:1}
.phb .n{font-family:var(--display);font-style:italic;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.phb[aria-pressed="true"]{opacity:1;outline:3px solid var(--ink);outline-offset:2px}
.phb:disabled{opacity:.25;cursor:not-allowed;filter:grayscale(.6)}
.phb:disabled .n,.phb:disabled .short{text-decoration:line-through}
.cta{border:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 18px;min-height:48px;font-family:var(--display);font-style:italic;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.cta:disabled{opacity:.35;cursor:default}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:10px 16px;min-height:44px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.note{background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:15px}
.note b{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--cyan-ink);margin-right:4px}
.bonus{background:var(--sand);border-radius:10px;padding:10px 14px;font-size:15px}
.bonus b{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--sand-ink);margin-right:6px}
.todo{border:2px solid var(--cyan);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.todo li{font-size:16px}
.todo ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-style:italic;font-weight:800;font-size:13px;text-transform:uppercase;color:#fff;padding:3px 10px 4px 0;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.chip i{background:rgba(0,0,0,.26);padding:3px 7px 4px;margin:-3px 0 -4px;font-style:italic}
.chip.done{opacity:.4}
.chip.cur{outline:2px solid var(--ink);outline-offset:2px}

/* automa card */
.acard{width:260px;aspect-ratio:63/88;max-width:100%;background:#fff;color:#1F1A24;border:1px solid #BDBDBD;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.18);flex-shrink:0}
.acard .kban{display:grid;grid-template-columns:42px minmax(0,1fr);height:45px;color:#fff;clip-path:polygon(0 0,calc(100% - 15px) 0,100% 15px,100% 100%,8px 100%,0 calc(100% - 8px));box-shadow:inset 0 -4px 0 rgba(0,0,0,.22)}
.acard .kban .r{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.26);font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;padding-bottom:4px}
.acard .kban .nm{display:flex;align-items:center;padding:0 10px 4px;font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;text-transform:uppercase;white-space:nowrap}
.acard .meta{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#1B5A7E;border-bottom:1.3px solid #2FB6C0;padding-bottom:3px}
.acard .au{display:flex;gap:8px;align-items:center;border-radius:6px;padding:9px 8px;font-size:13px;line-height:1.35}
.acard .au svg.ph{flex-shrink:0}
.acard .au b{font-weight:600}
.acard .bon{display:flex;align-items:center;gap:6px;background:#12202B;color:#fff;border-radius:5px;padding:5px 8px;font-size:12px;line-height:1.3}
.acard .bon .bl{flex-shrink:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:#E2BE2C}
.acard .cib{display:flex;align-items:center;gap:6px;border:1.5px solid;border-radius:5px;padding:6px 8px}
.acard .cib .l{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6E625A}
.acard .cn{font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;text-transform:uppercase;line-height:1}
.acard .cc{margin-left:auto;font-family:var(--display);font-weight:700;font-size:15px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.acard .vous{display:flex;gap:6px;align-items:flex-start;font-size:11.5px;line-height:1.3;color:#33302E;border-top:1.2px dashed #B9A48C;padding-top:5px}
.acard .vous .t{flex-shrink:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:11px;text-transform:uppercase;background:#E2BE2C;color:#1F1A24;padding:1px 7px 2px}
.acard .pi{vertical-align:-2px}
.acard .sp{flex:1}
.acard .why{font-size:12.5px;line-height:1.35;background:#E3F2F3;border-radius:6px;padding:6px 8px}
.reveal{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.reveal > div:last-child{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}

/* forms */
.fcard{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px}
.field input[type=number],.field select,.field input[type=text]{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;min-height:42px;width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:15px;min-height:42px}
.check input{width:20px;height:20px;accent-color:var(--cyan)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;min-height:42px;font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.lvl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvl button{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px}
.lvl button b{font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;text-transform:uppercase}
.lvl button span{font-size:13px;color:var(--muted)}
.lvl button[aria-pressed="true"]{border:2.5px solid var(--cyan);background:var(--panel2)}
.stepper{display:flex;align-items:stretch;gap:4px}
.stepper input{flex:1;min-width:0;text-align:center}
.stepper button{width:44px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-family:var(--display);font-weight:800;font-size:20px;line-height:1;color:var(--ink)}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input{-moz-appearance:textfield}
.lvl.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.lvl button:disabled{opacity:.45;cursor:not-allowed}
.fcol{display:flex;flex-direction:column;gap:10px}
.pick15{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pick15 button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;text-align:left;display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
.pick15 button b{font-family:var(--display);font-weight:800;font-size:18px;min-width:22px}
.pick15 button i{display:inline-block;width:6px;align-self:stretch;border-radius:3px}
.pick15 button:disabled{opacity:.35}

table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line)}
th{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
details summary{cursor:pointer;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.log{margin:8px 0 0;padding-left:36px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.score{font-family:var(--display);font-weight:800;font-style:italic;font-size:44px;line-height:1}
.toast{font-size:14px;color:var(--cyan-ink)}
@media (max-width:520px){
  .phases{grid-template-columns:repeat(5,minmax(0,1fr))}
  .phb{padding:8px 4px 10px}
  .phb .n,.full{display:none}
  .short{display:inline}
  .phb .short{font-family:var(--display);font-style:italic;font-weight:800;font-size:13px;text-transform:uppercase}
  .lvl{grid-template-columns:1fr}
  .params .v{font-size:19px}
  .top{flex-wrap:nowrap;gap:6px}
  .brand b{font-size:20px}
  .brand span{font-size:10.5px;letter-spacing:.12em}
  .tb{padding:6px 10px;min-height:44px}
  .tb .full{display:none}
  .tb .short{display:inline}
  .reveal{justify-content:center}
}
@media (pointer:coarse){
  .adj button{width:44px;height:40px}
}
@media (prefers-reduced-motion:no-preference){.acard{animation:flip .35s ease-out}@keyframes flip{from{transform:rotateY(70deg);opacity:.2}to{transform:none;opacity:1}}}
</style>

<div class="wrap" id="root">
  <header class="top">
    <div class="brand"><b>Automa hybride</b><span id="sub">Assistant de partie · v0.4 brouillon</span></div>
    <button class="tb" id="btn-undo" data-act="undo" aria-label="Annuler" disabled><span class="full">Annuler</span><span class="short" aria-hidden="true">↶</span></button>
    <button class="tb" id="btn-hist" data-act="hist" aria-label="Historique"><span class="full">Historique</span><span class="short" aria-hidden="true">Parties</span></button>
    <button class="tb" id="btn-new" data-act="askNew" aria-label="Nouvelle partie"><span class="full">Nouvelle partie</span><span class="short" aria-hidden="true">Nouvelle</span></button>
  </header>
  <div id="app"><p class="note">Chargement…</p></div>
  <footer style="border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)">
    <p>Projet de fans non officiel, non affilié à FryxGames ni à Stronghold Games. Terraforming Mars est une marque de FryxGames. Nécessite le jeu original.</p>
    <p>Règles et cartes sous licence CC BY-NC-SA 4.0 · <a href="https://github.com/manufitoussi/ares-solo-automa" style="color:inherit">GitHub</a></p>
  </footer>
</div>

<script>
(function(){
"use strict";
/* ---------- Données du jeu ---------- */
const PH = {
  I:{n:1,nom:"Développement",court:"Dév.",col:"var(--p1)",dark:false},
  II:{n:2,nom:"Construction",court:"Const.",col:"var(--p2g)",dark:false},
  III:{n:3,nom:"Action",court:"Action",col:"var(--p3)",dark:false},
  IV:{n:4,nom:"Production",court:"Prod.",col:"var(--p4)",dark:false},
  V:{n:5,nom:"Recherche",court:"Rech.",col:"var(--p5)",dark:true}
};
const ORDER = ["I","II","III","IV","V"];
const CIB = {foret:{nom:"Forêt",cout:20,col:"#3D7A47"},temp:{nom:"Température",cout:14,col:"#C2362B"},ocean:{nom:"Océan",cout:15,col:"#2E6FA8"}};
const CARDS = [
  {n:1,ph:"IV",c:"foret"},{n:2,ph:"IV",c:"temp"},{n:3,ph:"IV",c:"ocean"},
  {n:4,ph:"III",c:"foret"},{n:5,ph:"III",c:"temp"},{n:6,ph:"III",c:"ocean"},
  {n:7,ph:"I",c:"foret"},{n:8,ph:"I",c:"temp"},{n:9,ph:"I",c:"ocean"},
  {n:10,ph:"II",c:"foret"},{n:11,ph:"II",c:"temp"},{n:12,ph:"V",c:"ocean"},
  {n:13,react:"Riposte",c:"foret"},{n:14,react:"Opportuniste",c:"temp"},{n:15,react:"Course",c:"low"}
];
/* v0.4 levels: a handicap or a bonus on top of the drawn corporation; the Difficile and Expert bonuses are not decided yet */
const NIV = {facile:"Facile", standard:"Standard", difficile:"Difficile", expert:"Expert"};
const NIV_TXT = {facile:"Handicap : il part à 0 NT au lieu de 5 (à tester).", standard:"Ni handicap, ni bonus.", difficile:"Un bonus, à définir.", expert:"Un bonus plus fort, à définir."};
const NIV_OK = ["facile", "standard"];
const MAX = {oxy:14,temp:19,oce:9};

/* ---------- Pictos ---------- */
const IC = {
  mc:'<svg class="pi" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="1.5" y="1.5" width="17" height="17" rx="4" fill="#E2BE2C" stroke="#8A6D0B" stroke-width="1.2"/><text x="10" y="13.6" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="9" fill="#3A2C00">MC</text></svg>',

const allMax = p => p.oxy >= MAX.oxy && p.temp >= MAX.temp && p.oce >= MAX.oce;

/* ---------- Règles ---------- */
function leastAdvanced(p){
  const f = [["foret", p.oxy / MAX.oxy], ["temp", p.temp / MAX.temp], ["ocean", p.oce / MAX.oce]];
  let best = f[0]; for (const x of f) if (x[1] < best[1]) best = x; return best[0];
}
function effCible(c, p){
  const order = ["foret","temp","ocean"]; let i = order.indexOf(c);
  for (let k = 0; k < 3; k++) { const x = order[(i + k) % 3]; if (p[paramOf(x)] < MAX[paramOf(x)]) return x; }
  return "foret";
}
function resolveCard(st){
  const cd = card(st.card); let phase = cd.ph, why = "", cible = cd.c;
  if (cd.react === "Riposte") { phase = st.lastPlayerPhase || "IV"; why = st.lastPlayerPhase ? `Votre phase du tour précédent : ${PH[phase].nom}.` : "Premier tour : Production."; }
  if (cd.react === "Opportuniste") { phase = st.a.mc >= 20 ? "III" : "IV"; why = st.a.mc >= 20 ? `Il a ${st.a.mc} MC (20 ou plus) : il dépense en Action.` : `Il n'a que ${st.a.mc} MC (moins de 20) : il produit.`; }
  if (cd.react === "Course") { phase = "III"; cible = leastAdvanced(st.p); why = `Paramètre le moins avancé : ${CIB[cible].nom.toLowerCase()}.`; }
  return {phase, cible, why};
}
function computeAction(st, chose){
  const a = clone(st.a), p = {...st.p};
  const ch = {bonus:0, fPl:0, fMc:0, tCh:0, tMc:0, oce:0, nt:0, spent:0, oxy:0};
  if (chose) { a.mc += 5; ch.bonus = 5; }
  while (a.plantes >= 8) { a.plantes -= 8; a.forets++; ch.fPl++; if (p.oxy < MAX.oxy) { p.oxy++; a.nt++; ch.nt++; ch.oxy++; } }
  while (a.chaleur >= 8 && p.temp < MAX.temp) { a.chaleur -= 8; p.temp++; a.nt++; ch.nt++; ch.tCh++; }
  for (let g = 0; g < 200; g++) {
    const c = allMax(p) ? "foret" : effCible(st.cible, p), cost = CIB[c].cout;
    if (a.mc < cost) break;
    a.mc -= cost; ch.spent += cost;
    if (c === "foret") { a.forets++; ch.fMc++; if (p.oxy < MAX.oxy) { p.oxy++; a.nt++; ch.nt++; ch.oxy++; } }
    else if (c === "temp") { p.temp++; a.nt++; ch.nt++; ch.tMc++; }
    else { p.oce++; a.nt++; ch.nt++; ch.oce++; }
  }
  return {a, p, ch};
}
function computeProd(st, chose){
  const pr = st.a.prod;
  return {mc: pr.mc + st.a.nt + (chose ? 4 : 0) + pr.cartes * 3, chaleur: pr.chaleur, plantes: pr.plantes, cartesMc: pr.cartes * 3, bonus: chose ? 4 : 0};
}
const priceOf = (cost, pre, disc) => Math.max(0, Math.ceil(cost / 2) + (pre ? 5 : 0) - disc);
const maxCost = (mc, disc, pre) => 2 * (mc + disc - (pre ? 5 : 0));
const discOf = (ph, chose) => ph === "I" && chose ? 3 : 0;
function scoreAutoma(a){ const pv = a.cartes.reduce((s, c) => s + (+c.pv || 0), 0); return {nt:a.nt, forets:a.forets, pv, total:a.nt + a.forets + pv}; }

/* ---------- Persistance ---------- */
let saveTimer = null;
function save(){
  if (!S.state) return;
  S.state.savedAt = Date.now();
  try { localStorage.setItem(LS_STATE, JSON.stringify(S.state)); } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => { if (!db) return; try { await db.doc("partie/courante").set({state:S.state, savedAt:S.state.savedAt}); } catch (e) {} }, 500);
}
function loadLocal(){ try { const s = JSON.parse(localStorage.getItem(LS_STATE)); return s && s.v === 1 ? s : null; } catch (e) { return null; } }
async function loadHist(){
  if (db) { try { const q = await db.collection("parties").orderBy("date", "desc").limit(100).get(); S.hist = q.docs.map(d => d.data()); return; } catch (e) {} }
  try { S.hist = JSON.parse(localStorage.getItem(LS_HIST)) || []; } catch (e) { S.hist = []; }
}
async function saveGameRecord(rec){
  try { const h = JSON.parse(localStorage.getItem(LS_HIST) || "[]"); h.unshift(rec); localStorage.setItem(LS_HIST, JSON.stringify(h.slice(0, 100))); } catch (e) {}
  if (db) { try { await db.collection("parties").doc("p-" + rec.createdAt).set(rec); return true; } catch (e) { return false; } }
  return false;
}

function phasePreview(st, ph){

function curveSVG(track, w, h){
  const pts = (track || []).filter(x => x && x.t);

  const vals = pts.flatMap(x => [x.a, x.p]).filter(v => v != null);

  const pad = 4, X = t => pad + (t - t0) / Math.max(1, t1 - t0) * (w - 2 * pad), Y = v => h - pad - (v - lo) / (hi - lo) * (h - 2 * pad);

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%;height:auto" role="img" aria-label="NT par tour : vous en orange, l'automa en pointillés">${line("a", "var(--muted)", true)}${line("p", "var(--p4)")}</svg>`;
}

}
function applyPhase(){
  const st = S.state, ph = st.queue[st.qi], chose = st.automaPhase === ph;
  let takes = null;
  if (ph === "I" || ph === "II") {
    const r = readTakes(st, ph, chose);
    if (r.err) { const e = document.getElementById("perr"); if (e) e.textContent = r.err; return; }
    takes = r.takes;
  }
  commit();
  const mc0 = st.a.mc;
  if (ph === "I" || ph === "II") {
    takes.forEach((t, i) => {
      if (!t) {
        if (i === 1) { st.a.mc += 3; log(`${PH[ph].nom} : pas de 2e carte, +3 MC (bonus) → ${st.a.mc} MC`); }
        else log(`${PH[ph].nom} : rien à prendre`);
        return;
      }
      st.a.mc -= t.prix; st.a.cartes.push(t);
      if (t.prod) for (const k of ["mc","chaleur","plantes","cartes"]) st.a.prod[k] = Math.max(0, st.a.prod[k] + t.prod[k]);
      log(`${PH[ph].nom} : carte ${t.couleur} imprimée ${t.cout} MC${t.prereq ? " avec prérequis" : ""}, payée ${t.prix} MC → ${st.a.mc} MC, ${t.pv} PV${t.prod ? `, prod. +${t.prod.mc} MC +${t.prod.chaleur} chaleur +${t.prod.plantes} plantes +${t.prod.cartes} cartes` : ""}`);
    });
  } else if (ph === "III") {
    const r = computeAction(st, chose);
    st.a = r.a; st.p = r.p;
    if (r.ch.oce) { st.a.mc += num("o-mc") + 3 * num("o-ca"); st.a.plantes += num("o-pl"); st.a.chaleur += num("o-ch"); }
    const c = r.ch, oMc = r.ch.oce ? num("o-mc") + 3 * num("o-ca") : 0;
    log(`Action : ${c.bonus ? `+${c.bonus} MC (bonus), ` : ""}${c.fPl + c.fMc} forêt(s), +${c.tCh + c.tMc} température, ${c.oce} océan(s), NT +${c.nt}, ${c.spent} MC dépensés${oMc ? `, +${oMc} MC (bonus océans)` : ""} → ${st.a.mc} MC (avant : ${mc0})`);
  } else if (ph === "IV") {
    const g = computeProd(st, chose); st.a.mc += g.mc; st.a.chaleur += g.chaleur; st.a.plantes += g.plantes;
    const parts = [`prod. ${st.a.prod.mc}`, `NT ${st.a.nt}`]; if (g.cartesMc) parts.push(`cartes ${g.cartesMc}`); if (g.bonus) parts.push(`bonus ${g.bonus}`);
    log(`Production : +${g.mc} MC (${parts.join(" + ")}) → ${st.a.mc} MC, +${g.chaleur} chaleur, +${g.plantes} plantes`);
  } else { st.a.mc += chose ? 6 : 3; log(`Recherche : +${chose ? "6 MC (3 + 3 bonus)" : "3 MC"} → ${st.a.mc} MC`); }
  st.qi++;
  if (allMax(st.p)) { st.status = "ended"; st.track = (st.track || []).filter(x => x.t !== st.turn); st.track.push({t:st.turn, a:st.a.nt, p:null}); log("Tous les paramètres sont au maximum : fin de partie."); }
  else if (st.qi >= st.queue.length) st.step = "endturn";
  save(); render(); window.scrollTo({top:0, behavior:"smooth"});
}
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, st = S.state;
  if (act !== "askNew" && S.confirmNew) S.confirmNew = false;
  switch (act) {
    case "askNew":
      if (!S.confirmNew && st && st.status !== "ended") { S.confirmNew = true; render(); setTimeout(() => { if (S.confirmNew) { S.confirmNew = false; render(); } }, 4000); return; }
      S.confirmNew = false; S.state = null; S.undo = []; S.view = "game"; S.toast = "";
      try { localStorage.removeItem(LS_STATE); } catch (e) {}
      if (db) { try { await db.doc("partie/courante").delete(); } catch (e) {} }
      break;
    case "lvl": S.setup.niveau = b.dataset.k; break;
    case "pioche": S.setup.pioche = b.dataset.k; break;
    case "step": {
      const inp = document.getElementById(b.dataset.for); if (!inp) return;
      let v = (parseInt(inp.value, 10) || 0) + +b.dataset.d;
      if (inp.min !== "") v = Math.max(+inp.min, v); if (inp.max !== "") v = Math.min(+inp.max, v);
      inp.value = v; inp.dispatchEvent(new Event("change", {bubbles:true})); return; }
    case "begin": { S.state = newGame(); S.undo = []; const k = S.setup.corp;
      log(`Nouvelle partie (règles v0.4), niveau ${NIV[S.state.niveau]}, corporation : ${+k.mc || 0} MC, prod. ${+k.pmc || 0} MC ${+k.pch || 0} chaleur ${+k.ppl || 0} plantes`); save(); break; }
    case "pick": st.playerPhase = b.dataset.ph; save(); break;
    case "draw": {
      commit();
      if (!st.deck.length) { st.deck = shuffle(st.discard); st.discard = []; log("Pioche automa remélangée"); }
      if (b.dataset.n) { const n = +b.dataset.n; st.card = n; st.deck = st.deck.filter(x => x !== n); st.discard = st.discard.filter(x => x !== n); }
      else st.card = st.deck.pop();
      const r = resolveCard(st); st.automaPhase = r.phase; st.cible = r.cible; st.why = r.why;
      st.queue = ORDER.filter(ph => ph === st.playerPhase || ph === st.automaPhase); st.qi = 0; st.step = "reveal";
      log(`Carte ${st.card} : ${PH[st.automaPhase].nom}, cible ${CIB[st.cible].nom.toLowerCase()} (vous : ${PH[st.playerPhase].nom})`);
      save(); break; }
    case "start": commit(); st.step = "phase"; save(); break;
    case "apply": applyPhase(); return;
    case "next": commit(); recordTurn(st); st.discard.push(st.card); st.card = null; st.lastPlayerPhase = st.playerPhase; st.playerPhase = null; st.turn++; st.step = "plan"; save(); break;
    case "end": commit(); recordTurn(st); st.status = "ended"; log("Partie terminée à la demande"); save(); break;
    case "resume": commit(); st.status = "playing"; save(); break;
    case "saveGame": {
      st.playerScore = document.getElementById("e-score").value === "" ? null : num("e-score");
      st.remark = document.getElementById("e-rem").value.trim();
      const sc = scoreAutoma(st.a);
      const rec = {date:new Date().toISOString(), createdAt:st.createdAt, niveau:st.niveau, tours:st.turn, scoreJoueur:st.playerScore, scoreAutoma:sc.total,
        detail:{nt:sc.nt, forets:sc.forets, pvCartes:sc.pv, nbCartes:st.a.cartes.length, prod:st.a.prod, mcFin:st.a.mc}, params:st.p, remarque:st.remark, courbe:st.track || [], pioche:st.pioche || "app", version:"0.4"};
      const remote = await saveGameRecord(rec);
      st.saved = true; S.toast = remote ? "Partie enregistrée dans l'historique." : "Partie enregistrée dans ce navigateur."; save(); break; }
    case "hist": S.view = "hist"; await loadHist(); break;
    case "back": S.view = "game"; break;
    case "undo": if (S.undo.length) { S.state = JSON.parse(S.undo.pop()); save(); } break;
    case "edit": S.edit = !S.edit; break;
    case "adj": {
      commit(); const k = b.dataset.k, d = +b.dataset.d;
      const get = () => k.startsWith("prod.") ? st.a.prod[k.slice(5)] : st.a[k], old = get();
      if (k.startsWith("prod.")) { const f = k.slice(5); st.a.prod[f] = Math.max(0, st.a.prod[f] + d); } else st.a[k] = Math.max(0, st.a[k] + d);
      const NOMS = {mc:"MC", chaleur:"chaleur", plantes:"plantes", nt:"NT", forets:"forêts", "prod.mc":"prod. MC", "prod.chaleur":"prod. chaleur", "prod.plantes":"prod. plantes", "prod.cartes":"prod. cartes"};
      const head = `T${st.turn} · Correction ${NOMS[k] || k} : `, prev = st.log[0] || "";
      if (prev.startsWith(head)) { const from = prev.slice(head.length).split(" → ")[0]; st.log[0] = `${head}${from} → ${get()}`; } else log(`Correction ${NOMS[k] || k} : ${old} → ${get()}`);
      save(); break; }
    case "par": {
      commit(); const k = b.dataset.k; st.p[k] = Math.min(MAX[k], Math.max(0, st.p[k] + +b.dataset.d)); save(); break; }
    default: return;
  }
  render();
});
function onField(ev){
  const t = ev.target; if (!t.dataset) return;
  if (t.dataset.corp) { const v = parseInt(t.value, 10); S.setup.corp[t.dataset.corp] = isNaN(v) ? 0 : v; }
  if (t.dataset.price != null) updPrice(t.dataset.price);
  if (t.dataset.act === "nonechg") { const body = document.getElementById(`c${t.dataset.i}-body`); if (body) body.hidden = t.checked; }
}
document.addEventListener("input", onField);
document.addEventListener("change", onField);

/* ---------- Démarrage ---------- */
S.state = loadLocal();
render();
(async () => {
  const use = window.claude && window.claude.use;
  if (!use) return;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) return;
  try {
    const snap = await db.doc("partie/courante").get();
    if (snap.exists) { const d = snap.data(); if (d && d.state && (!S.state || (d.savedAt || 0) > (S.state.savedAt || 0))) { S.state = clone(d.state); render(); } }
    else if (S.state) save();
  } catch (e) {}
})();
})();
</script>
